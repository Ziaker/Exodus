<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-0 m-0">
  <div class="py-1.5 space-y-2 select-none">
    <!-- Barra dos 8 ataques D-124 -->
    <div class="flex flex-wrap items-center justify-between gap-1.5 pb-1.5 border-b border-[var(--card-border)] text-xs">
      <div class="flex flex-wrap items-center gap-1">
        <button data-skill="mazz_bite" class="sk-btn px-2 py-1 rounded font-medium border border-[var(--border)] transition">Mazz Bite</button>
        <button data-skill="fang_sting" class="sk-btn px-2 py-1 rounded font-medium border border-[var(--border)] transition">Fang Sting</button>
        <button data-skill="fang_spine" data-zahav="1" class="sk-btn px-2 py-1 rounded font-medium border border-[var(--border)] transition">✦ Fang Spine</button>
        <button data-skill="vuln_pierce" class="sk-btn px-2 py-1 rounded font-medium border border-[var(--border)] transition">Vuln Pierce</button>
        <button data-skill="dark_breath" class="sk-btn px-2 py-1 rounded font-medium border border-[var(--border)] transition">Dark Breath</button>
        <button data-skill="umbral_gaze" class="sk-btn px-2 py-1 rounded font-medium border border-[var(--border)] transition">Umbral Gaze</button>
        <button data-skill="ignoma" class="sk-btn px-2 py-1 rounded font-medium border border-[var(--border)] transition">Ignoma</button>
        <button data-skill="ignoma_esh" data-zahav="1" class="sk-btn px-2 py-1 rounded font-medium border border-[var(--border)] transition">✦ Ignoma Esh <span class="opacity-85">אש</span></button>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button id="btn-replay" class="px-2 py-1 rounded border border-[var(--border)] bg-[var(--card)] hover:bg-[var(--secondary)] text-[var(--foreground)] transition">↻</button>
        <label class="flex items-center gap-1 text-[var(--muted-foreground)] cursor-pointer">
          <input id="chk-loop" type="checkbox" checked class="accent-[var(--primary)]" />
          Loop
        </label>
        <button id="btn-speed" class="px-1.5 py-1 rounded border border-[var(--border)] bg-[var(--card)] font-mono tabular-nums text-[var(--muted-foreground)] hover:text-[var(--foreground)] transition">1.0×</button>
      </div>
    </div>

    <!-- Palco EXODUS -->
    <div class="relative w-full rounded overflow-hidden border border-[var(--card-border)] bg-[#0b0714]">
      <canvas id="stage" width="816" height="360" class="block w-full h-auto"></canvas>
    </div>

    <!-- Legenda -->
    <div class="flex items-center justify-between gap-2 text-xs text-[var(--muted-foreground)]">
      <span id="caption-text" class="truncate"></span>
      <span id="badge-text" class="font-mono text-[11px] opacity-80 shrink-0"></span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const W = canvas.width;
    const H = canvas.height;

    const ALPHABET = 'אבגדהוזחטיכלמנסעפצקרשת';
    const randGlyph = () => ALPHABET[(Math.random() * ALPHABET.length) | 0];
    const FIRE_HEBREW = ['#ff7a1f', '#ffd84a', '#ffffff'];

    const BAYER = [
      [0,  8,  2, 10],
      [12, 4, 14,  6],
      [3, 11,  1,  9],
      [15, 7, 13,  5]
    ];

    // Paletas sombrias e orgânicas (preto absoluto, osso, 1 tom sujo — sem neon)
    const PALS = {
      blood:  { accent: '#a81c2e', hi: '#efe6d5', deep: '#24050a' },
      zahav:  { accent: '#b87d14', hi: '#fff1b8', deep: '#2b1904', sub: '#a81c2e' },
      abyss:  { accent: '#5c3680', hi: '#e8e2f0', deep: '#12071d' },
      fire:   { accent: '#c95418', hi: '#f5e4b8', deep: '#290d04' }
    };

    const SKILLS = {
      mazz_bite: {
        title: 'MAZZ BITE · 1 ACT / 30% HP MÁX · HIGH SPEED (+20%) · 10 + 30% HP EXTRA',
        badge: 'RABISCO GROTESCO + MOIRÉ',
        log: ['FALLEN sacrifices 30% MAX HP — HIGH SPEED (+20%) distortion surges!', 'MAZZ BITE devours MAZIK B: 10 + 30% MAX HP DMG!'],
        duration: 2.35
      },
      fang_sting: {
        title: 'FANG STING · 2 ACT / 6 EN · 5 + ATK · BLEED (-20% CURA) SÓ NO POINT',
        badge: 'RABISCO + FENDA HIPNÓTICA',
        log: ['FALLEN drives a skeletal sting into MAZIK B...', 'POINT hit! 5 + ATK DMG — BLEED (-20% healing, up to 4x)!'],
        duration: 2.35
      },
      fang_spine: {
        title: 'FANG SPINE [ZAHAV] · 3 ACT / 10 EN · 2 ATAQUES ALTERNÁVEIS · 15 + ATK · BLEED ×2 NO POINT',
        badge: 'ZAHAV · ESPINHA GROTESCA ×2',
        log: ['ZAHAV awakens FANG SPINE across MAZIK A & MAZIK B!', 'Double skeletal eruption! 15 + ATK each — BLEED x2!'],
        duration: 2.65
      },
      vuln_pierce: {
        title: 'VULN PIERCE · 1 ACT / 8 EN · 15 + ATK · 2× CONTRA AÇÃO NÃO-OFENSIVA',
        badge: 'OLHO EXPOSTO + GARRA + MOIRÉ',
        log: ['MAZIK B exposes an unguarded eye during a non-offensive action!', 'VULN PIERCE ruptures the opening: 2x DMG (30 + 2x ATK)!'],
        duration: 2.45
      },
      dark_breath: {
        title: 'DARK BREATH · 3 ACT / 15 EN · TODOS INIMIGOS · 0 DMG · -3 PP + CEGUEIRA',
        badge: 'BOCA ABISSAL + MARÉ HIPNÓTICA',
        log: ['An abyssal maw opens — hypnotic darkness floods every foe!', '0 DMG — all unblocked targets lose 3 PP and are BLINDED!'],
        duration: 2.85
      },
      umbral_gaze: {
        title: 'UMBRAL GAZE · 3 ACT / 15 EN · 15 + MAK · APRISIONA POR 2 AÇÕES GLOBAIS',
        badge: 'OLHO NO CHÃO + DEDOS + MOIRÉ',
        log: ['A giant eye opens beneath MAZIK B — warped limbs erupt!', 'UMBRAL GAZE deals 15 + MAK! TRAPPED for 2 actions (AUTO-PASS)!'],
        duration: 2.85
      },
      ignoma: {
        title: 'IGNOMA · 2 ACT / 8 EN · 1 ALVO · 10 + MAK · 35% BURN',
        badge: 'CHAMA RABISCADA + MOIRÉ TÉRMICO',
        log: ['FALLEN hurls IGNOMA — a feverish sketch of fire streaks forward!', 'IGNOMA bursts on MAZIK B: 10 + MAK DMG + BURN!'],
        duration: 2.45
      },
      ignoma_esh: {
        title: 'IGNOMA ESH [ZAHAV] · 3 ACT / 12 EN · 2 ALVOS ALTERNÁVEIS · 10 + MAK · 35% BURN',
        badge: 'ZAHAV · RABISCO + MOIRÉ + אש',
        log: ['ZAHAV ignites IGNOMA ESH — twin grotesque flames split into אש!', 'MAZIK A & MAZIK C scorched: 10 + MAK each + BURN!'],
        duration: 2.85
      }
    };

    const FOES = [
      { id: 'A', name: 'MAZIK A', x: 214, y: 150, w: 64, h: 102 },
      { id: 'B', name: 'MAZIK B', x: 408, y: 142, w: 72, h: 112 },
      { id: 'C', name: 'MAZIK C', x: 602, y: 150, w: 64, h: 102 }
    ];

    let activeSkill = 'mazz_bite';
    let t = 0;
    let speed = 1.0;
    let loop = true;
    let lastTs = performance.now();
    let fx = {};

    function hash(n) {
      const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
      return s - Math.floor(s);
    }

    function initSkill(id) {
      activeSkill = id;
      t = 0;
      fx = {};
      if (id === 'ignoma_esh') {
        fx.orbs = [
          { foeIdx: 0, startT: 0.08, hitT: 0.62, sx: 145, sy: 248 },
          { foeIdx: 2, startT: 0.44, hitT: 1.04, sx: 145, sy: 248 }
        ].map(o => ({
          ...o,
          burst: Array.from({ length: 34 }, (_, i) => {
            const a = (i / 34) * Math.PI * 2 + (Math.random() - 0.5) * 0.2;
            const s = 65 + Math.random() * 175;
            return { vx: Math.cos(a) * s, vy: Math.sin(a) * s - 18, ch: i % 3 === 0 ? 'אש'[i % 2] : randGlyph(), sz: 12 + Math.random() * 10, ci: i % 3, life: 0.52 + Math.random() * 0.48 };
          })
        }));
      }
      updateUI();
    }

    function updateUI() {
      document.querySelectorAll('.sk-btn').forEach(btn => {
        const on = btn.dataset.skill === activeSkill;
        const zahav = btn.dataset.zahav === '1';
        if (on) {
          btn.style.backgroundColor = zahav ? '#a16207' : 'var(--primary)';
          btn.style.color = '#ffffff';
          btn.style.borderColor = zahav ? '#ffd84a' : 'var(--primary)';
        } else {
          btn.style.backgroundColor = 'var(--card)';
          btn.style.color = zahav ? '#eab308' : 'var(--foreground)';
          btn.style.borderColor = 'var(--border)';
        }
      });
      document.getElementById('caption-text').textContent = SKILLS[activeSkill].title;
      document.getElementById('badge-text').textContent = SKILLS[activeSkill].badge;
    }

    // Fundo EXODUS dithered real
    function drawExodusBg(time) {
      ctx.fillStyle = '#240d19';
      ctx.fillRect(0, 22, W, 152);
      ctx.fillStyle = '#381425';
      const step = 6;
      for (let y = 22; y < 174; y += step) {
        const thresh = (((y - 22) / 152) * 10) | 0;
        for (let x = 0; x < W; x += step) {
          if (BAYER[((y / step) | 0) & 3][((x / step + ((time * 2) | 0)) | 0) & 3] < thresh) {
            ctx.fillRect(x, y, step, step);
          }
        }
      }
      ctx.fillStyle = '#2b1d15';
      ctx.fillRect(0, 174, W, 74);
      ctx.fillStyle = '#18100b';
      for (let i = 0; i < 6; i++) ctx.fillRect(0, 178 + i * 12, W, 2);
      ctx.fillStyle = 'rgba(245, 245, 140, 0.08)';
      ctx.fillRect(0, 246, W, 2);
    }

    function drawFoe(foe, inv, warpAmp, tags, dmgLabel) {
      ctx.save();
      const x = foe.x, y = foe.y;
      ctx.fillStyle = 'rgba(0,0,0,0.52)';
      ctx.beginPath();
      ctx.ellipse(x, y + foe.h * 0.54, foe.w * 0.52, 7, 0, 0, Math.PI * 2);
      ctx.fill();

      const parts = [
        [-foe.w * 0.24, -foe.h * 0.52, foe.w * 0.48, foe.h * 0.22],
        [-foe.w * 0.30, -foe.h * 0.62, foe.w * 0.12, foe.h * 0.16],
        [ foe.w * 0.18, -foe.h * 0.62, foe.w * 0.12, foe.h * 0.16],
        [-foe.w * 0.44, -foe.h * 0.26, foe.w * 0.88, foe.h * 0.46],
        [-foe.w * 0.56, -foe.h * 0.16, foe.w * 0.12, foe.h * 0.28],
        [ foe.w * 0.44, -foe.h * 0.16, foe.w * 0.12, foe.h * 0.28],
        [-foe.w * 0.18,  foe.h * 0.20, foe.w * 0.36, foe.h * 0.32]
      ];
      ctx.fillStyle = inv ? '#efe6d5' : '#050208';
      if (warpAmp > 0.3) {
        for (let sy = -foe.h * 0.62; sy < foe.h * 0.54; sy += 3.5) {
          const wx = Math.sin(sy * 0.18 + t * 20) * warpAmp + Math.cos(sy * 0.09 - t * 12) * warpAmp * 0.5;
          parts.forEach(([px, py, pw, ph]) => {
            if (sy >= py && sy < py + ph) ctx.fillRect(x + px + wx, y + sy, pw, 4);
          });
        }
      } else {
        parts.forEach(([px, py, pw, ph]) => ctx.fillRect(x + px, y + py, pw, ph));
      }

      ctx.font = 'bold 11px monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#dcd6e8';
      ctx.fillText(foe.name, x, y - foe.h * 0.68);

      if (tags && tags.length) {
        tags.forEach((tg, idx) => {
          ctx.font = 'bold 10px monospace';
          ctx.fillStyle = tg.col;
          ctx.fillText(tg.text, x, y + foe.h * 0.68 + idx * 13);
        });
      }
      if (dmgLabel) {
        ctx.font = 'bold 16px monospace';
        ctx.fillStyle = dmgLabel.col || '#efe6d5';
        ctx.fillText(dmgLabel.text, x, y - 24 - dmgLabel.rise);
      }
      ctx.restore();
    }

    // Motor reutilizável 1: Campo de Interferência Hipnótica (Giygas / Moiré sombrio)
    function drawHypnoticField(cx, cy, rx, ry, env, time, pal, mode = 'radial') {
      if (env <= 0.02 || rx <= 2 || ry <= 2) return;
      ctx.save();
      const step = 5;
      const x0 = Math.max(0, ((cx - rx) / step | 0) * step);
      const y0 = Math.max(22, ((cy - ry) / step | 0) * step);
      const x1 = Math.min(W, ((cx + rx) / step | 0) * step);
      const y1 = Math.min(246, ((cy + ry) / step | 0) * step);
      const irx2 = 1 / (rx * rx + 1), iry2 = 1 / (ry * ry + 1);

      for (let y = y0; y < y1; y += step) {
        const dy = y - cy;
        for (let x = x0; x < x1; x += step) {
          const dx = x - cx;
          const norm = dx * dx * irx2 + dy * dy * iry2;
          if (norm > 1) continue;
          const fall = 1 - Math.sqrt(norm);
          const dist = Math.sqrt(dx * dx + dy * dy);
          let v;
          if (mode === 'wave') {
            v = Math.sin(x * 0.09 - time * 16 + Math.sin(y * 0.09 + time * 9) * 2.4)
              + Math.cos(y * 0.14 + Math.sin(x * 0.05 - time * 7) * 2.0);
          } else {
            const ang = Math.atan2(dy, dx);
            v = Math.sin(dist * 0.21 - time * 14 + Math.sin(ang * 4 + time * 5) * 2.1)
              + Math.cos((dx * 0.1 - dy * 0.08) + Math.sin(y * 0.08 + time * 8) * 1.9);
          }
          if (v * fall * env > 0.30) {
            ctx.fillStyle = v > 1.28 ? pal.hi : (v > 0.72 ? pal.accent : '#050208');
            ctx.globalAlpha = Math.min(0.92, env * fall * 1.45);
            ctx.fillRect(x, y, step, step);
          }
        }
      }
      ctx.restore();
    }

    // Motor reutilizável 2: Polígono rabiscado à mão (boil 12 FPS)
    function sketchyPoly(pts, fIdx, jitter = 2.4, close = true) {
      ctx.beginPath();
      pts.forEach(([x, y], i) => {
        const jx = (hash(fIdx * 31 + i * 7) - 0.5) * jitter * 2;
        const jy = (hash(fIdx * 47 + i * 13) - 0.5) * jitter * 2;
        if (i === 0) ctx.moveTo(x + jx, y + jy); else ctx.lineTo(x + jx, y + jy);
      });
      if (close) ctx.closePath();
    }

    function drawSketchShape(pts, fIdx, pal, jitter = 2.4, fillCol = '#050208') {
      sketchyPoly(pts, fIdx, jitter, true);
      if (fillCol) {
        ctx.fillStyle = fillCol;
        ctx.fill();
      }
      ctx.strokeStyle = pal.hi;
      ctx.lineWidth = 2;
      ctx.stroke();
      sketchyPoly(pts, fIdx + 77, jitter * 1.5, true);
      ctx.strokeStyle = pal.accent;
      ctx.lineWidth = 1.25;
      ctx.stroke();
    }

    function drawSketchEye(cx, cy, rx, ry, fIdx, pal, closed = false) {
      const pts = [];
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * (closed ? ry * 0.18 : ry)]);
      }
      drawSketchShape(pts, fIdx, pal, 1.4, closed ? '#050208' : pal.hi);
      if (!closed) {
        ctx.fillStyle = '#050208';
        ctx.beginPath();
        ctx.arc(cx + (hash(fIdx * 13) - 0.5) * rx * 0.28, cy, Math.min(rx, ry) * 0.55, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // Risco em X sobre olho fechado (cegueira)
        ctx.strokeStyle = pal.accent;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx - rx * 1.1, cy - ry * 0.9);
        ctx.lineTo(cx + rx * 1.1, cy + ry * 0.9);
        ctx.moveTo(cx + rx * 1.1, cy - ry * 0.9);
        ctx.lineTo(cx - rx * 1.1, cy + ry * 0.9);
        ctx.stroke();
      }
    }

    function drawHebrewTriWord(word, cx, cy, px, alpha) {
      if (alpha <= 0.01) return;
      ctx.save();
      ctx.font = `bold ${px}px "Times New Roman", serif`;
      ctx.textAlign = 'center';
      ctx.globalAlpha = alpha;
      const chars = [...word];
      const step = px * 0.62;
      const sx = cx + ((chars.length - 1) * step) * 0.5;
      chars.forEach((ch, i) => {
        ctx.fillStyle = FIRE_HEBREW[i % 3];
        ctx.fillText(ch, sx - i * step, cy);
      });
      ctx.restore();
    }

    function drawHud(logLine, topTag, fallenHp, isZahav) {
      ctx.fillStyle = 'rgba(10, 6, 18, 0.85)';
      ctx.fillRect(0, 0, W, 22);
      ctx.font = 'bold 11px monospace';
      ctx.textAlign = 'left';
      ctx.fillStyle = '#cfc7e2';
      ctx.fillText('ROUND 1   FALLEN SP 80   YOCH SP 45', 14, 15);
      if (topTag) {
        ctx.textAlign = 'right';
        ctx.fillStyle = isZahav ? '#ffd84a' : '#efe6d5';
        ctx.fillText(topTag, W - 14, 15);
      }

      ctx.fillStyle = 'rgba(10, 7, 20, 0.92)';
      ctx.fillRect(14, 254, W - 28, 40);
      ctx.fillStyle = isZahav ? 'rgba(255, 216, 74, 0.45)' : 'rgba(239, 230, 213, 0.28)';
      ctx.fillRect(14, 254, W - 28, 1);
      ctx.fillRect(14, 293, W - 28, 1);
      ctx.font = '12px monospace';
      ctx.textAlign = 'left';
      ctx.fillStyle = isZahav ? '#ffd84a' : '#efe6d5';
      ctx.fillText('* ' + logLine, 26, 278);

      ctx.fillStyle = 'rgba(14, 10, 26, 0.92)';
      ctx.fillRect(14, 302, 260, 46);
      ctx.font = 'bold 12px monospace';
      ctx.fillStyle = '#f2eefc';
      ctx.fillText('▸ FALLEN', 26, 320);
      ctx.fillStyle = '#ff7b7b';
      ctx.fillText(fallenHp || 'HP 100/100', 26, 338);
      ctx.fillStyle = '#8ad8ff';
      ctx.fillText('EN 28/40', 148, 338);

      ctx.fillStyle = 'rgba(14, 10, 26, 0.92)';
      ctx.fillRect(284, 302, 232, 46);
      ctx.fillStyle = '#dcd6e8';
      ctx.fillText('YOCH', 296, 320);
      ctx.fillStyle = '#9fe29f';
      ctx.fillText('HP 74/74', 296, 338);
      ctx.fillStyle = '#f5f58c';
      ctx.fillText('PP 6/8', 410, 338);

      ctx.fillStyle = 'rgba(14, 10, 26, 0.92)';
      ctx.fillRect(526, 302, 276, 46);
      ctx.fillStyle = isZahav ? '#ffd84a' : '#efe6d5';
      ctx.fillText((isZahav ? 'ZAHAV ▸ ' : 'SKILL ▸ ') + activeSkill.toUpperCase().replace('_', ' '), 538, 330);
    }

    // ===================== 1. MAZZ BITE =====================
    function renderMazzBite() {
      const pal = PALS.blood;
      const target = FOES[1];
      const qt = Math.floor(t * 12) / 12;
      const fIdx = Math.floor(t * 12);
      const hitT = 0.56;
      const hit = qt >= hitT;
      const age = Math.max(0, qt - hitT);
      const env = !hit ? Math.pow(qt / hitT, 1.6) * 0.65 : Math.max(0, 1 - age / 1.0);

      let sx = 0, sy = 0;
      if (hit && age < 0.25) { sx = (hash(fIdx * 3) - 0.5) * 16; sy = (hash(fIdx * 5) - 0.5) * 16; }

      ctx.save();
      ctx.translate(sx, sy);
      drawExodusBg(t);
      drawHypnoticField(target.x, target.y, 48 + env * 74, 42 + env * 62, env, t, pal);

      const dmg = hit && age < 1.05 ? { text: '10 + 30% HP!', rise: age * 26, col: '#ff8a96' } : null;
      FOES.forEach((f, i) => drawFoe(f, i === 1 && hit && age < 0.14, i === 1 ? env * 11 : 0, null, i === 1 ? dmg : null));

      // Mini barra HIGH SPEED (+20%)
      if (!hit) {
        const bx = target.x - 68, by = target.y - 84;
        ctx.fillStyle = 'rgba(5,2,8,0.82)';
        ctx.fillRect(bx, by, 136, 9);
        ctx.fillStyle = '#4f202c'; ctx.fillRect(bx + 48, by + 1, 40, 7);
        ctx.fillStyle = '#efe6d5'; ctx.fillRect(bx + 62, by + 1, 12, 7);
        ctx.fillStyle = pal.accent; ctx.fillRect(bx + Math.min(1, (t / hitT) * 1.2) * 136 - 3, by - 3, 6, 15);
      }

      // Mandíbula grotesca assimétrica rabiscada (12fps)
      if (t > 0.16 && age < 0.85) {
        const p = !hit ? Math.pow((qt - 0.16) / (hitT - 0.16), 1.8) : 1;
        const a = !hit ? Math.min(1, 0.35 + 0.65 * p) : Math.max(0, 1 - age / 0.85);
        const gap = !hit ? (1 - p) * 52 : 0;
        ctx.save();
        ctx.globalAlpha = a;
        [-1, 1].forEach(dir => {
          const pts = [];
          const by = target.y + dir * (12 + gap);
          pts.push([target.x - 74, by + dir * 28]);
          for (let i = -5; i <= 5; i++) {
            const tx = target.x + i * 12;
            const th = (hash(i * 19 + dir * 7) * 20 + 12) * (Math.abs(i) === 2 ? 1.55 : 1);
            pts.push([tx - 4, by], [tx + (hash(i * 11) - 0.5) * 6, by - dir * th], [tx + 4, by]);
          }
          pts.push([target.x + 74, by + dir * 28]);
          drawSketchShape(pts, fIdx + dir * 5, pal, 2.4);
        });
        if (hit && age < 0.65) {
          drawSketchEye(target.x - 62, target.y - 34, 13, 6, fIdx + 1, pal);
          drawSketchEye(target.x + 64, target.y - 26, 11, 5, fIdx + 2, pal);
          drawSketchEye(target.x - 48, target.y + 38, 10, 4.5, fIdx + 3, pal);
        }
        ctx.restore();
      }
      ctx.restore();
      drawHud(SKILLS.mazz_bite.log[hit ? 1 : 0], 'HIGH SPEED (+20% POINTER)', t > 0.25 ? 'HP 70/100 (-30%)' : 'HP 100/100', false);
    }

    // ===================== 2. FANG STING =====================
    function renderFangSting() {
      const pal = PALS.blood;
      const target = FOES[1];
      const qt = Math.floor(t * 12) / 12;
      const fIdx = Math.floor(t * 12);
      const hitT = 0.50;
      const hit = qt >= hitT;
      const age = Math.max(0, qt - hitT);
      const env = hit ? Math.max(0, 1 - age / 0.95) : 0;

      ctx.save();
      drawExodusBg(t);
      // Fenda diagonal de interferência hipnótica rasgada no impacto
      if (hit) drawHypnoticField(target.x, target.y, 88 * env, 26 * env, env, t, pal);

      const tags = hit ? [{ text: 'BLEED (-20% HEAL)', col: '#e05a6b' }] : null;
      const dmg = hit && age < 1.05 ? { text: 'POINT · 5 + ATK', rise: age * 26, col: '#efe6d5' } : null;
      FOES.forEach((f, i) => drawFoe(f, i === 1 && hit && age < 0.14, i === 1 ? env * 8 : 0, i === 1 ? tags : null, i === 1 ? dmg : null));

      // Ferrão/dedo ósseo grotesco perfurando em diagonal
      if (age < 0.65) {
        const ext = !hit ? Math.pow(qt / hitT, 1.5) * 0.55 : Math.min(1, 0.55 + age * 4);
        const a = !hit ? 0.85 : Math.max(0, 1 - age / 0.65);
        ctx.save();
        ctx.globalAlpha = a;
        const x0 = target.x - 155, y0 = target.y + 62;
        const x1 = x0 + 285 * ext, y1 = y0 - 115 * ext;
        drawSketchShape([
          [x0 - 8, y0 - 12], [x0 + 95 * ext, y0 - 44 * ext], [x1, y1],
          [x0 + 100 * ext, y0 - 26 * ext], [x0 + 10, y0 + 10]
        ], fIdx, pal, 2.2);
        // Respingos rabiscados de sangue (BLEED)
        if (hit) {
          for (let i = 0; i < 8; i++) {
            const ang = -0.6 + (hash(i * 17) - 0.5) * 1.4;
            const d = 14 + age * (90 + hash(i * 23) * 130);
            const sx = target.x + Math.cos(ang) * d;
            const sy = target.y + Math.sin(ang) * d + 85 * age * age;
            drawSketchShape([[sx - 3, sy - 2], [sx + 5, sy], [sx - 2, sy + 5]], fIdx + i, pal, 1.4, pal.accent);
          }
        }
        ctx.restore();
      }
      ctx.restore();
      drawHud(SKILLS.fang_sting.log[hit ? 1 : 0], hit ? 'POINT -> BLEED!' : 'SKELETAL THRUST', null, false);
    }

    // ===================== 3. FANG SPINE [ZAHAV] =====================
    function renderFangSpine() {
      const pal = PALS.zahav;
      const qt = Math.floor(t * 12) / 12;
      const fIdx = Math.floor(t * 12);
      const hits = [{ foeIdx: 0, hitT: 0.46 }, { foeIdx: 1, hitT: 1.02 }];

      ctx.save();
      drawExodusBg(t);

      // Campos de interferência dourado-sangue em ambos os alvos alternados
      hits.forEach(h => {
        const age = qt - h.hitT;
        if (age >= 0 && age < 0.95) {
          const env = 1 - age / 0.95;
          drawHypnoticField(FOES[h.foeIdx].x, FOES[h.foeIdx].y, 68 * env + 18, 56 * env + 14, env, t, pal);
        }
      });

      FOES.forEach((f, i) => {
        const h = hits.find(x => x.foeIdx === i);
        const age = h ? qt - h.hitT : -1;
        const env = age >= 0 && age < 0.9 ? 1 - age / 0.9 : 0;
        const tags = age >= 0 ? [{ text: 'BLEED x2 (-40% HEAL)', col: '#e05a6b' }] : null;
        const dmg = age >= 0 && age < 1.0 ? { text: '15 + ATK', rise: age * 26, col: '#fff1b8' } : null;
        drawFoe(f, age >= 0 && age < 0.14, env * 9, tags, dmg);
      });

      // Espinha dorsal rabiscada saltando de MAZIK A para MAZIK B
      if (qt >= 0.5 && qt <= 1.18) {
        const a = 1 - Math.abs((qt - 0.84) / 0.34);
        ctx.save();
        ctx.globalAlpha = Math.max(0, a);
        const pts = [];
        for (let i = 0; i <= 8; i++) {
          const p = i / 8;
          const x = FOES[0].x + (FOES[1].x - FOES[0].x) * p;
          const y = 140 - Math.sin(p * Math.PI) * 68 + (i % 2 === 0 ? -9 : 9);
          pts.push([x, y]);
        }
        sketchyPoly(pts, fIdx, 2.5, false);
        ctx.strokeStyle = pal.hi; ctx.lineWidth = 2.5; ctx.stroke();
        ctx.restore();
      }

      // Costelas / espinhos grotescos irrompendo nos 2 alvos
      hits.forEach((h, hi) => {
        const age = qt - h.hitT;
        if (age < 0 || age > 0.8) return;
        const foe = FOES[h.foeIdx];
        const a = Math.max(0, 1 - age / 0.8);
        const ext = Math.min(1, age / 0.12);
        ctx.save();
        ctx.globalAlpha = a;
        for (let k = -2; k <= 2; k++) {
          const y0 = foe.y + k * 17;
          const dir = hi === 0 ? 1 : -1;
          const len = (52 + (2 - Math.abs(k)) * 18) * ext;
          drawSketchShape([
            [foe.x - dir * 56, y0 - 5],
            [foe.x - dir * 56 + dir * len, y0 + k * 4],
            [foe.x - dir * 56, y0 + 5]
          ], fIdx + k * 3 + hi * 11, pal, 2.2);
        }
        ctx.restore();
      });

      ctx.restore();
      drawHud(SKILLS.fang_spine.log[qt > 0.5 ? 1 : 0], 'ZAHAV · 2 ALTERNATING HITS', null, true);
    }

    // ===================== 4. VULN PIERCE =====================
    function renderVulnPierce() {
      const pal = PALS.blood;
      const target = FOES[1];
      const qt = Math.floor(t * 12) / 12;
      const fIdx = Math.floor(t * 12);
      const hitT = 0.64;
      const hit = qt >= hitT;
      const age = Math.max(0, qt - hitT);
      const env = !hit ? (qt / hitT) * 0.45 : Math.max(0, 1 - age / 0.95);

      ctx.save();
      drawExodusBg(t);
      drawHypnoticField(target.x, target.y, 44 + env * 86, 36 + env * 66, env, t, hit ? PALS.zahav : pal);

      const tags = !hit ? [{ text: 'NON-OFFENSIVE ACTION', col: '#a8c6df' }] : [{ text: '2x VULN SHATTERED!', col: '#fff1b8' }];
      const dmg = hit && age < 1.05 ? { text: '2x! (30 + 2x ATK)', rise: age * 28, col: '#fff1b8' } : null;
      FOES.forEach((f, i) => drawFoe(f, i === 1 && hit && age < 0.16, i === 1 ? env * 12 : 0, i === 1 ? tags : null, i === 1 ? dmg : null));

      if (!hit) {
        // Olho vulnerável aberto e tremendo no centro da postura não-ofensiva
        const g = Math.min(1, qt / 0.45);
        drawSketchEye(target.x, target.y, 26 * g, 12 * g, fIdx, PALS.zahav, false);
      } else if (age < 0.72) {
        const a = Math.max(0, 1 - age / 0.72);
        ctx.save();
        ctx.globalAlpha = a;
        // Garra / agulha grotesca perfurando horizontalmente de lado a lado
        drawSketchShape([
          [target.x - 190, target.y - 10], [target.x + 195, target.y], [target.x - 190, target.y + 10]
        ], fIdx, PALS.zahav, 2.8);
        // Estilhaços rabiscados do olho quebrado
        for (let i = 0; i < 10; i++) {
          const ang = (i / 10) * Math.PI * 2 + 0.3;
          const d = 16 + age * 150;
          const sx = target.x + Math.cos(ang) * d, sy = target.y + Math.sin(ang) * d * 0.7;
          drawSketchShape([[sx - 6, sy - 4], [sx + 7, sy], [sx - 2, sy + 6]], fIdx + i * 5, pal, 1.8);
        }
        ctx.restore();
      }
      ctx.restore();
      drawHud(SKILLS.vuln_pierce.log[hit ? 1 : 0], hit ? '2x DAMAGE TRIGGERED' : 'OPENING EXPOSED', null, false);
    }

    // ===================== 5. DARK BREATH =====================
    function renderDarkBreath() {
      const pal = PALS.abyss;
      const qt = Math.floor(t * 12) / 12;
      const fIdx = Math.floor(t * 12);
      const waveStart = 0.28;
      const wp = Math.max(0, Math.min(1, (t - waveStart) / 1.45));
      const headX = 50 + wp * (W + 120);

      ctx.save();
      drawExodusBg(t);

      // Maré horizontal de interferência hipnótica abissal varrendo todo o palco
      if (t >= waveStart && t < 2.55) {
        const fade = t < 1.9 ? 0.92 : Math.max(0, 0.92 * (1 - (t - 1.9) / 0.65));
        drawHypnoticField(headX - 160, 146, 210, 92, fade, t, pal, 'wave');
      }

      FOES.forEach((f, i) => {
        const hitT = 0.62 + i * 0.24;
        const age = qt - hitT;
        const env = age >= 0 && age < 0.95 ? 1 - age / 0.95 : 0;
        const tags = age >= 0 ? [{ text: 'BLIND (ROUND)', col: '#cbb2e8' }] : null;
        const dmg = age >= 0 && age < 1.05 ? { text: '-3 PP · BLIND', rise: age * 22, col: '#e8e2f0' } : null;
        drawFoe(f, false, env * 9, tags, dmg);
        // Olho riscado em X sobre cada inimigo cegado
        if (age >= 0 && age < 1.35) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, 1 - Math.max(0, age - 0.7) / 0.65);
          drawSketchEye(f.x, f.y - 34, 18, 8, fIdx + i * 7, pal, true);
          ctx.restore();
        }
      });

      // Boca grotesca abissal abrindo na borda esquerda vomitando o bafo!
      if (t < 2.1) {
        const open = t < 0.4 ? t / 0.4 : (t < 1.6 ? 1 : Math.max(0, 1 - (t - 1.6) / 0.5));
        ctx.save();
        ctx.globalAlpha = open;
        const pts = [[0, 60], [64 * open, 86], [28 * open, 108], [76 * open, 126], [34 * open, 148], [78 * open, 172], [30 * open, 194], [62 * open, 214], [0, 238]];
        drawSketchShape(pts, fIdx, pal, 3.0);
        ctx.restore();
      }
      ctx.restore();
      drawHud(SKILLS.dark_breath.log[t > 0.72 ? 1 : 0], '0 DMG · -3 PP · BLIND', null, false);
    }

    // ===================== 6. UMBRAL GAZE =====================
    function renderUmbralGaze() {
      const pal = PALS.abyss;
      const target = FOES[1];
      const qt = Math.floor(t * 12) / 12;
      const fIdx = Math.floor(t * 12);
      const hitT = 0.62;
      const hit = qt >= hitT;
      const age = Math.max(0, qt - hitT);
      const fade = qt < 2.25 ? 1 : Math.max(0, 1 - (qt - 2.25) / 0.6);
      const env = Math.min(0.92, qt / 0.45) * fade;
      const fy = target.y + target.h * 0.54;

      ctx.save();
      drawExodusBg(t);
      drawHypnoticField(target.x, target.y + 18, 92 * env, 76 * env, env * 0.85, t, pal);

      // Olho gigante rabiscado no chão sob os pés
      ctx.save();
      ctx.globalAlpha = fade;
      const g = Math.min(1, qt / 0.42);
      drawSketchEye(target.x, fy, 76 * g, 17 * g, fIdx, pal, false);
      ctx.restore();

      const tags = hit ? [{ text: 'TRAPPED (2 ACTS · AUTO-PASS)', col: '#e8e2f0' }] : null;
      const dmg = hit && age < 1.05 ? { text: '15 + MAK', rise: age * 24, col: '#e8e2f0' } : null;
      FOES.forEach((f, i) => drawFoe(f, i === 1 && hit && age < 0.14, i === 1 ? env * 8 : 0, i === 1 ? tags : null, i === 1 ? dmg : null));

      // Dedos/espinhos esqueléticos tortos subindo do olho e aprisionando
      if (hit) {
        const r = Math.min(1, age / 0.16);
        ctx.save();
        ctx.globalAlpha = fade;
        [-48, -24, 0, 24, 48].forEach((ox, i) => {
          const sh = (92 + (i % 2) * 38) * r;
          const bend = (i - 2) * -10;
          drawSketchShape([
            [target.x + ox - 6, fy],
            [target.x + ox + bend * 0.5 - 4, fy - sh * 0.55],
            [target.x + ox + bend, fy - sh],
            [target.x + ox + bend * 0.5 + 5, fy - sh * 0.55],
            [target.x + ox + 6, fy]
          ], fIdx + i * 7, pal, 2.5);
        });
        ctx.restore();
      }
      ctx.restore();
      drawHud(SKILLS.umbral_gaze.log[hit ? 1 : 0], hit ? 'TRAPPED: 2 GLOBAL ACTS' : 'EYE OPENING BELOW', null, false);
    }

    // ===================== 7. IGNOMA =====================
    function renderIgnoma() {
      const pal = PALS.fire;
      const target = FOES[1];
      const qt = Math.floor(t * 12) / 12;
      const fIdx = Math.floor(t * 12);
      const hitT = 0.62;
      const hit = qt >= hitT;
      const age = Math.max(0, qt - hitT);
      const env = !hit ? 0.55 : Math.max(0, 1 - age / 0.95);
      const sx = 148, sy = 242;
      const p = Math.min(1, qt / hitT);
      const bx = !hit ? sx + (target.x - sx) * p : target.x;
      const by = !hit ? sy + (target.y - sy) * p - Math.sin(p * Math.PI) * 52 : target.y;

      ctx.save();
      drawExodusBg(t);
      drawHypnoticField(bx, by, !hit ? 46 : 44 + (1 - env) * 95, !hit ? 40 : 38 + (1 - env) * 78, env, t, pal);

      const tags = hit ? [{ text: 'BURN (35%)', col: '#e87835' }] : null;
      const dmg = hit && age < 1.05 ? { text: '10 + MAK', rise: age * 26, col: '#f5e4b8' } : null;
      FOES.forEach((f, i) => drawFoe(f, i === 1 && hit && age < 0.14, i === 1 && hit ? env * 10 : 0, i === 1 ? tags : null, i === 1 ? dmg : null));

      // Massa de fogo grotesca rabiscada (12fps) com olho de brasa dentro
      if (env > 0.02) {
        ctx.save();
        ctx.globalAlpha = Math.min(1, env * 1.25);
        const rad = !hit ? 24 : 26 + (age / 0.95) * 62;
        const pts = [];
        for (let i = 0; i < 16; i++) {
          const ang = (i / 16) * Math.PI * 2;
          const rr = rad * (i % 2 === 0 ? 1.32 : 0.66);
          pts.push([bx + Math.cos(ang) * rr, by + Math.sin(ang) * rr - (i % 2 === 0 ? 9 : 0)]);
        }
        drawSketchShape(pts, fIdx, pal, 3.8, pal.deep);
        if (!hit) drawSketchEye(bx, by, 10, 5, fIdx + 9, pal, false);
        ctx.restore();
      }
      ctx.restore();
      drawHud(SKILLS.ignoma.log[hit ? 1 : 0], 'FIRE SKETCH · 35% BURN', null, false);
    }

    // ===================== 8. IGNOMA ESH [ZAHAV · ÚNICA COM אש] =====================
    function renderIgnomaEsh() {
      const pal = PALS.fire;
      const qt = Math.floor(t * 12) / 12;
      const fIdx = Math.floor(t * 12);

      ctx.save();
      drawExodusBg(t);

      // Interferência térmica nos 2 alvos alternados (MAZIK A e MAZIK C)
      fx.orbs.forEach(o => {
        const foe = FOES[o.foeIdx];
        if (qt >= o.startT && qt < o.hitT) {
          const p = (qt - o.startT) / (o.hitT - o.startT);
          const bx = o.sx + (foe.x - o.sx) * p;
          const by = o.sy + (foe.y - o.sy) * p - Math.sin(p * Math.PI) * 64;
          drawHypnoticField(bx, by, 40, 36, 0.55, t, PALS.zahav);
        } else if (qt >= o.hitT) {
          const age = qt - o.hitT;
          if (age < 0.95) {
            const env = 1 - age / 0.95;
            drawHypnoticField(foe.x, foe.y, 44 + (1 - env) * 86, 38 + (1 - env) * 72, env, t, pal);
          }
        }
      });

      FOES.forEach((f, i) => {
        const o = fx.orbs.find(x => x.foeIdx === i);
        const age = o ? qt - o.hitT : -1;
        const env = age >= 0 && age < 0.9 ? 1 - age / 0.9 : 0;
        const tags = age >= 0 ? [{ text: 'BURN (35%)', col: '#ff7a1f' }] : null;
        const dmg = age >= 0 && age < 1.05 ? { text: '10 + MAK', rise: age * 26, col: '#ffd84a' } : null;
        drawFoe(f, age >= 0 && age < 0.14, env * 9, tags, dmg);
      });

      ctx.textAlign = 'center';
      fx.orbs.forEach((o, oi) => {
        const foe = FOES[o.foeIdx];
        if (qt >= o.startT && qt < o.hitT) {
          // Chama grotesca rabiscada em voo carregando o núcleo אש
          const p = (qt - o.startT) / (o.hitT - o.startT);
          const bx = o.sx + (foe.x - o.sx) * p;
          const by = o.sy + (foe.y - o.sy) * p - Math.sin(p * Math.PI) * (oi === 0 ? 52 : 82);
          const pts = [];
          for (let i = 0; i < 14; i++) {
            const a = (i / 14) * Math.PI * 2;
            const r = 22 * (i % 2 === 0 ? 1.3 : 0.7);
            pts.push([bx + Math.cos(a) * r, by + Math.sin(a) * r]);
          }
          drawSketchShape(pts, fIdx + oi * 5, PALS.zahav, 3.0, pal.deep);
          drawHebrewTriWord('אש', bx, by + 6, 18, 0.95);
        } else if (t >= o.hitT) {
          const age = t - o.hitT;
          // No impacto, a chama grotesca se rompe em letras hebraicas אש em 3 cores!
          if (age < 0.45) {
            const pts = [];
            const rad = 26 + age * 95;
            for (let i = 0; i < 16; i++) {
              const a = (i / 16) * Math.PI * 2;
              const r = rad * (i % 2 === 0 ? 1.25 : 0.75);
              pts.push([foe.x + Math.cos(a) * r, foe.y + Math.sin(a) * r]);
            }
            ctx.save();
            ctx.globalAlpha = Math.max(0, 1 - age / 0.45);
            drawSketchShape(pts, fIdx + oi * 7, pal, 4.0, null);
            ctx.restore();
          }
          o.burst.forEach(b => {
            if (age > b.life) return;
            const a = Math.max(0, 1 - age / b.life);
            ctx.save();
            ctx.globalAlpha = a;
            ctx.font = `bold ${b.sz | 0}px "Times New Roman", serif`;
            ctx.fillStyle = FIRE_HEBREW[b.ci];
            ctx.fillText(b.ch, foe.x + b.vx * age, foe.y + b.vy * age + 85 * age * age);
            ctx.restore();
          });
          if (age < 0.9) drawHebrewTriWord('אש', foe.x, foe.y - 24 - age * 20, 30, 1 - age / 0.9);
        }
      });

      ctx.restore();
      drawHud(SKILLS.ignoma_esh.log[t > 0.65 ? 1 : 0], 'ZAHAV · SKETCH + MOIRÉ + אש', null, true);
    }

    function frame(now) {
      const dt = Math.min(0.05, (now - lastTs) / 1000) * speed;
      lastTs = now;
      t += dt;
      if (t > SKILLS[activeSkill].duration) {
        if (loop) initSkill(activeSkill);
        else t = SKILLS[activeSkill].duration;
      }

      switch (activeSkill) {
        case 'mazz_bite':   renderMazzBite(); break;
        case 'fang_sting':  renderFangSting(); break;
        case 'fang_spine':  renderFangSpine(); break;
        case 'vuln_pierce': renderVulnPierce(); break;
        case 'dark_breath': renderDarkBreath(); break;
        case 'umbral_gaze': renderUmbralGaze(); break;
        case 'ignoma':      renderIgnoma(); break;
        case 'ignoma_esh':  renderIgnomaEsh(); break;
      }
      requestAnimationFrame(frame);
    }

    document.querySelectorAll('.sk-btn').forEach(btn => {
      btn.addEventListener('click', () => initSkill(btn.dataset.skill));
    });
    document.getElementById('btn-replay').addEventListener('click', () => initSkill(activeSkill));
    document.getElementById('chk-loop').addEventListener('change', e => { loop = e.target.checked; });
    document.getElementById('btn-speed').addEventListener('click', e => {
      speed = speed === 1.0 ? 0.5 : 1.0;
      e.target.textContent = speed.toFixed(1) + '×';
    });
    window.addEventListener('themechange', updateUI);

    initSkill('mazz_bite');
    requestAnimationFrame(frame);
  </script>
</body>
</html>
